[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "localaimcp"
version = "0.1.0"
description = "Stateless async FastMCP control plane for the LocalAI REST and WebSocket APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp==3.4.7",
  "httpx>=0.28,<0.29",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
localaimcp = "localaimcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/localaimcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/localaimcp/swagger.part1.b64" = "localaimcp/swagger.part1.b64"
"src/localaimcp/swagger.part2.b64" = "localaimcp/swagger.part2.b64"
"src/localaimcp/swagger.part3.b64" = "localaimcp/swagger.part3.b64"
"src/localaimcp/swagger.part4.b64" = "localaimcp/swagger.part4.b64"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
