name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]' build
      - name: Test
        run: pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify bundled Swagger parts
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          expected = {f"localaimcp/swagger.part{i}.b64" for i in range(1, 5)}
          missing = expected - names
          assert not missing, f"wheel is missing Swagger payload parts: {sorted(missing)}"
          PY
